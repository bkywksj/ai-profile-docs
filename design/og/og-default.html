<!doctype html>
<!-- 默认分享图源文件（1200×630）：改完运行 pnpm og 重新生成 public/og-default.png
     画而不截图：分享卡片常被缩到 300px 宽，真实页面截图里的导航和正文会糊成一片；
     这里只放站名、一句话和几个要点，缩小后仍能读。本站：靛蓝 #4f46e5 与旧站 style.css 的配色（浅底 rgba(79,70,229,.14)、浅底上的字 #4338ca），Logo 内嵌旧站 public/logo.svg 原文件；不用渐变。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --brand: #4f46e5;
        --ink: #17181c;
        --muted: #42454d;
        --canvas: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 36px;
        padding: 0 96px;
        background: #f6f6f8;
        border-bottom: 10px solid var(--brand);
        color: var(--ink);
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 700;
      }
      .mark {
        width: 64px;
        height: 64px;
      }
      .mark svg {
        width: 64px;
        height: 64px;
        display: block;
      }
      .hl {
        background: linear-gradient(transparent 58%, rgba(79, 70, 229, 0.14) 58%);
        box-shadow: inset 0 -3px 0 #4f46e5;
      }
      h1 {
        max-width: 960px;
        font-size: 64px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      ul {
        display: flex;
        gap: 18px;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 10px 22px;
        background: rgba(79, 70, 229, 0.14);
        color: #4338ca;
        border-radius: 999px;
        font-size: 26px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="brand"><span class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect x="4" y="4" width="112" height="112" rx="26" fill="#4f46e5"/><g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M68.02 30.06A31 31 0 0 1 89.94 68.02"/><path d="M81.92 81.92A31 31 0 0 1 38.08 81.92"/><path d="M30.06 68.02A31 31 0 0 1 51.98 30.06"/></g><circle cx="60" cy="60" r="9" fill="#fff"/></svg></span>ai-profile · AI 模型服务配置层</div>
    <h1>AI 模型服务配置，<br />多个应用<span class="hl">只写一份</span></h1>
    <ul>
      <li>31 家服务商 · 42 条预置</li>
      <li>零成本验证</li>
      <li>MIT 开源 Rust crate</li>
    </ul>
  </body>
</html>
